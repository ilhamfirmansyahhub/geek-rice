# ==============================================================================
# Brain Shell Keybinds
# Auto-generated by Quickshell. Do not edit manually.
# ==============================================================================

# ==============================================================================
# BrainShell Capture Submap (Disables all normal binds during recording)
# ==============================================================================
submap = BrainShell_clean
bind = CTRL, ESCAPE, exec, notify-send 'BrainShell' 'Emergency Exit: Keybinds re-enabled.'
bind = CTRL, ESCAPE, submap, reset
submap = reset

# ==============================================================================
# User Defined Bindings
# ==============================================================================

# Dashboard
bind = SUPER, D, exec, qs ipc -c $HOME/.config/quickshell/brain-desktop call dashboard-home toggle
bind = CTRL SHIFT, ESCAPE, exec, qs ipc -c $HOME/.config/quickshell/brain-desktop call dashboard-stats toggle
bind = SUPER, Z, exec, qs ipc -c $HOME/.config/quickshell/brain-desktop call dashboard-kanban toggle
bind = SUPER, SPACE, exec, qs ipc -c $HOME/.config/quickshell/brain-desktop call dashboard-launcher toggle
bind = SUPER, C, exec, qs ipc -c $HOME/.config/quickshell/brain-desktop call dashboard-config toggle

# Popups
bind = SUPER, ESCAPE, exec, qs ipc -c $HOME/.config/quickshell/brain-desktop call PowerMenu-toggle toggle
bind = SUPER, N, exec, qs ipc -c $HOME/.config/quickshell/brain-desktop call notification-toggle toggle
bind = SUPER, W, exec, qs ipc -c $HOME/.config/quickshell/brain-desktop call wallpaper-toggle toggle
bind = SUPER, V, exec, qs ipc -c $HOME/.config/quickshell/brain-desktop call clipboard-toggle toggle

# Network Tabs
bind = SUPER ALT, W, exec, qs ipc -c $HOME/.config/quickshell/brain-desktop call wifi-toggle toggle
bind = SUPER ALT, B, exec, qs ipc -c $HOME/.config/quickshell/brain-desktop call bluetooth-toggle toggle
bind = SUPER ALT, G, exec, qs ipc -c $HOME/.config/quickshell/brain-desktop call vpn-toggle toggle
bind = SUPER ALT, H, exec, qs ipc -c $HOME/.config/quickshell/brain-desktop call hotspot-toggle toggle

# Audio Tabs
bind = SUPER, A, exec, qs ipc -c $HOME/.config/quickshell/brain-desktop call audioOut-toggle toggle
bind = SUPER ALT, I, exec, qs ipc -c $HOME/.config/quickshell/brain-desktop call audioIn-toggle toggle
bind = SUPER, M, exec, qs ipc -c $HOME/.config/quickshell/brain-desktop call audioMix-toggle toggle

# Quick Settings
bind = SUPER, F, exec, qs ipc -c $HOME/.config/quickshell/brain-desktop call focus-toggle toggle
bind = ALT, F9, exec, qs ipc -c $HOME/.config/quickshell/brain-desktop call screenrec-on toggle
